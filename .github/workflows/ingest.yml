name: ingest

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Ingest and digest both write data/. Queue rather than race.
concurrency:
  group: data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch sources into the pool
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m ingest.run

      - name: Commit the pool
        run: |
          git config user.name "firehose-bot"
          git config user.email "firehose-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore: ingest $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      - name: Report failure to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m send.alert
